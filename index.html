<!DOCTYPE html>
<html lang="en">
<head>
<script src="/theme-init.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAIE — Join the Waitlist</title>
<meta name="description" content="Be first in line for MAIE — the AI-native media production suite. Join the waitlist.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Same brand tokens as portal.joinmaie.com's maie-tokens.css — kept
     in sync manually since this is a separate Cloudflare Pages project.
     If the brand red ever changes again, update BOTH places (light
     block too — see below). */
  :root {
    --primary: #A52A2A;
    --primary-light: #C24E4E;
    --primary-glow: rgba(165,42,42,0.32);
    --bg: #09090B;
    --surface: #111318;
    --border: rgba(255,255,255,0.09);
    --text-1: rgba(232,230,227,0.94);
    --text-2: rgba(232,230,227,0.60);
    --font-display: 'Bebas Neue', sans-serif;
    --font-ui: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  /* Light mode — set via data-theme="light" on <html> by theme-init.js
     (seed, pre-paint) and the header toggle's click handler. Mirrors
     the light values used in the portal's maie-tokens.css. */
  [data-theme="light"] {
    --primary: #772E25;
    --primary-light: #A52A2A;
    --primary-glow: rgba(119,46,37,0.18);
    --bg: #EDEEF1;
    --surface: #FFFFFF;
    --border: rgba(0,0,0,0.10);
    --text-1: rgba(17,19,24,0.94);
    --text-2: rgba(17,19,24,0.62);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text-1);
    font-family: var(--font-ui);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 24px 24px;
    transition: background 0.22s ease, color 0.22s ease;
  }
  .wl-header {
    width: 100%; max-width: 480px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 0 8px;
  }
  .wl-header-brand {
    font-family: var(--font-display);
    font-size: 18px; letter-spacing: 0.02em; color: var(--text-1);
  }
  .wl-main {
    display: flex; align-items: center; justify-content: center;
    width: 100%; flex: 1;
  }
  .wl-glow {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse 60% 50% at 50% 0%, var(--primary-glow), transparent 70%);
  }
  .wl-card {
    position: relative; z-index: 1;
    width: 100%; max-width: 480px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 36px;
    transition: background 0.22s ease, border-color 0.22s ease;
  }
  .wl-tag {
    font-family: var(--font-mono);
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--primary-light); margin-bottom: 10px;
  }
  h1 {
    font-family: var(--font-display);
    font-size: clamp(36px, 6vw, 48px);
    letter-spacing: 0.02em;
    margin: 0 0 12px;
    line-height: 1;
  }
  .wl-sub {
    color: var(--text-2); font-size: 15px; line-height: 1.5; margin: 0 0 28px;
  }
  form { display: flex; flex-direction: column; gap: 14px; }
  label { font-size: 13px; color: var(--text-2); margin-bottom: 4px; display: block; }
  input, select {
    width: 100%; background: rgba(255,255,255,0.03);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 11px 12px; color: var(--text-1); font-family: var(--font-ui); font-size: 14px;
  }
  input:focus, select:focus { outline: none; border-color: var(--primary-light); }
  /* The closed <select> box correctly picks up the page's dark theme, but
     the native options popup is drawn by the browser with its own white
     background regardless — so the same light --text-1 color meant for
     dark surfaces became near-invisible there except on the hovered row
     (which browsers force to white-on-blue). Force dark text explicitly
     for the popup only. */
  select option { color: #1a1a1a; background: #ffffff; }
  .wl-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .wl-hp { position: absolute; left: -9999px; opacity: 0; }
  button[type="submit"] {
    margin-top: 8px; background: var(--primary); color: #fff; border: none;
    border-radius: 8px; padding: 13px 20px; font-size: 15px; font-weight: 600;
    font-family: var(--font-ui); cursor: pointer; transition: background 0.15s ease;
  }
  button[type="submit"]:hover { background: var(--primary-light); }
  button[type="submit"]:disabled { opacity: 0.6; cursor: default; }
  .wl-msg { font-size: 14px; margin-top: 4px; min-height: 20px; }
  .wl-msg.ok { color: #6fbf8a; }
  .wl-msg.err { color: #d97b7b; }
  .wl-footer { margin-top: 24px; font-size: 12px; color: var(--text-2); text-align: center; }
  .wl-footer a { color: var(--primary-light); text-decoration: none; }

  /* ── Theme toggle — same look as the app's ThemeToggle.tsx / the
     portal's shared nav (Sun/Moon pill switch). ─────────────────── */
  .mnav-theme-toggle {
    display: inline-flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none;
    background: none; border: none; padding: 0;
  }
  .mnav-theme-track {
    position: relative; width: 40px; height: 22px; border-radius: 100px;
    border: 1px solid transparent;
    transition: background 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    flex-shrink: 0;
  }
  [data-theme="dark"] .mnav-theme-track { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.12); }
  [data-theme="light"] .mnav-theme-track { background: rgba(165,42,42,0.12); border-color: rgba(165,42,42,0.3); box-shadow: 0 0 0 1px rgba(165,42,42,0.12); }
  .mnav-theme-thumb {
    position: absolute; top: 2px; width: 16px; height: 16px; border-radius: 50%;
    transition: left 0.22s cubic-bezier(0.4,0,0.2,1), background 0.22s ease, box-shadow 0.22s ease;
    display: flex; align-items: center; justify-content: center;
  }
  .mnav-theme-thumb svg { width: 10px; height: 10px; display: block; }
  [data-theme="dark"] .mnav-theme-thumb { left: 2px; background: rgba(232,230,227,0.45); box-shadow: none; color: #1a1a1a; }
  [data-theme="light"] .mnav-theme-thumb { left: 20px; background: #A52A2A; box-shadow: 0 1px 6px rgba(165,42,42,0.45); color: #fff; }
  .mnav-theme-label {
    font-family: var(--font-mono); font-size: 10.5px; font-weight: 500;
    letter-spacing: 0.06em; text-transform: uppercase; transition: color 0.22s ease;
  }
  [data-theme="dark"] .mnav-theme-label { color: rgba(232,230,227,0.38); }
  [data-theme="light"] .mnav-theme-label { color: rgba(165,42,42,0.75); }
</style>
</head>
<body>
<div class="wl-glow"></div>
<header class="wl-header">
  <span class="wl-header-brand">MAIE</span>
  <button class="mnav-theme-toggle" id="mnav-theme-toggle" type="button">
    <span class="mnav-theme-track">
      <span class="mnav-theme-thumb" id="mnav-theme-thumb"></span>
    </span>
    <span class="mnav-theme-label" id="mnav-theme-label"></span>
  </button>
</header>
<div class="wl-main">
<div class="wl-card">
  <div class="wl-tag">MAIE — EARLY ACCESS</div>
  <h1>Join the waitlist</h1>
  <p class="wl-sub">Be first in line when MAIE opens up. A few quick details help us prioritize the right people first.</p>

  <form id="wl-form">
    <input class="wl-hp" type="text" name="company_website" tabindex="-1" autocomplete="off">

    <div>
      <label for="email">Email *</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com">
    </div>

    <div class="wl-row2">
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Jane Doe">
      </div>
      <div>
        <label for="company">Company</label>
        <input type="text" id="company" name="company" placeholder="Optional">
      </div>
    </div>

    <div class="wl-row2">
      <div>
        <label for="role">Role</label>
        <input type="text" id="role" name="role" placeholder="e.g. CTO, Editor">
      </div>
      <div>
        <label for="github_user">GitHub username</label>
        <input type="text" id="github_user" name="github_user" placeholder="Optional">
      </div>
    </div>

    <div>
      <label for="found_via">How did you hear about us?</label>
      <select id="found_via" name="found_via">
        <option value="">Select one</option>
        <option value="github">GitHub</option>
        <option value="twitter_x">Twitter / X</option>
        <option value="referral">Referral</option>
        <option value="search">Search engine</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div>
      <label>What are you interested in?</label>
      <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:4px;">
        <label style="display:flex; align-items:center; gap:6px; font-size:13px;">
          <input type="checkbox" name="interests" value="ai_agents" style="width:auto;"> AI agents
        </label>
        <label style="display:flex; align-items:center; gap:6px; font-size:13px;">
          <input type="checkbox" name="interests" value="oss" style="width:auto;"> Open source
        </label>
        <label style="display:flex; align-items:center; gap:6px; font-size:13px;">
          <input type="checkbox" name="interests" value="video_tools" style="width:auto;"> Video tools
        </label>
        <label style="display:flex; align-items:center; gap:6px; font-size:13px;">
          <input type="checkbox" name="interests" value="marketplace" style="width:auto;"> Marketplace
        </label>
      </div>
    </div>

    <button type="submit" id="wl-submit">Join the waitlist</button>
    <div class="wl-msg" id="wl-msg"></div>
  </form>

  <div class="wl-footer">
    Source and docs on <a href="https://github.com/maie" target="_blank" rel="noopener">GitHub</a>.
  </div>
</div>
</div>

<script>
  // ── Theme toggle ──────────────────────────────────────────────────
  (function () {
    var SUN_ICON  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
    var MOON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>';
    var themeBtn = document.getElementById('mnav-theme-toggle');
    var themeThumb = document.getElementById('mnav-theme-thumb');
    var themeLabel = document.getElementById('mnav-theme-label');

    function renderTheme() {
      var isDark = document.documentElement.getAttribute('data-theme') !== 'light';
      if (themeThumb) themeThumb.innerHTML = isDark ? MOON_ICON : SUN_ICON;
      if (themeLabel) themeLabel.textContent = isDark ? 'Dark' : 'Light';
      if (themeBtn) {
        var next = isDark ? 'light' : 'dark';
        themeBtn.setAttribute('aria-label', 'Switch to ' + next + ' mode');
        themeBtn.setAttribute('title', 'Switch to ' + next + ' mode');
      }
    }
    renderTheme();

    if (themeBtn) {
      themeBtn.addEventListener('click', function () {
        var isDark = document.documentElement.getAttribute('data-theme') !== 'light';
        var next = isDark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('maie-theme', next); } catch (e) {}
        renderTheme();
      });
    }
  })();

  const form = document.getElementById('wl-form');
  const msg = document.getElementById('wl-msg');
  const btn = document.getElementById('wl-submit');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    msg.className = 'wl-msg';
    btn.disabled = true;
    btn.textContent = 'Joining…';

    const fd = new FormData(form);
    const payload = {
      email: fd.get('email'),
      name: fd.get('name'),
      company: fd.get('company'),
      role: fd.get('role'),
      github_user: fd.get('github_user'),
      found_via: fd.get('found_via'),
      interests: fd.getAll('interests'),
      company_website: fd.get('company_website'), // honeypot
    };

    try {
      const res = await fetch('/api/waitlist', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        msg.textContent = data.alreadyJoined ? "You're already on the list." : "You're on the list — thanks!";
        msg.classList.add('ok');
        form.reset();
      } else {
        msg.textContent = data.error || 'Something went wrong. Try again.';
        msg.classList.add('err');
      }
    } catch {
      msg.textContent = 'Network error — please try again.';
      msg.classList.add('err');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Join the waitlist';
    }
  });
</script>
</body>
</html>
